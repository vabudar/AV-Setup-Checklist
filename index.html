<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AV Setup Checklist</title>
    
    <meta name="theme-color" content="#556462">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #F4F7F2; overscroll-behavior-y: none; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        .font-publico { font-family: 'Playfair Display', Georgia, serif; font-style: italic; }
        .font-gillsans { font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif; }
        
        /* Updated brand color #556462 */
        .bg-brand-green { background-color: #556462; }
        .text-brand-green { color: #556462; }
        .border-brand-green { border-color: #556462; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800">

    <div id="app" class="max-w-[480px] mx-auto min-h-screen flex flex-col relative overflow-hidden bg-[#F4F7F2] shadow-2xl">
        
        <div class="bg-brand-green h-14 flex items-center justify-between px-5 shadow-sm sticky top-0 z-30 pt-4 pb-4">
            <button @click="resetApp" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="font-bold text-white text-sm tracking-wider uppercase">AV Assistant</span>
            </button>
        </div>

        <div v-if="screen === 'home'" class="flex flex-col flex-1 min-h-[calc(100vh-56px)] justify-between">
            <div class="p-8 flex-1">
                <div class="text-center py-6 mb-4 select-none">
                    <h2 class="text-lg text-slate-500 font-publico tracking-wide leading-none">The</h2>
                    <h1 class="text-[44px] font-bold tracking-[0.16em] text-slate-900 font-gillsans uppercase mt-0.5 leading-none">TRON</h1>
                    <p class="text-sm text-slate-500 font-publico tracking-wide mt-1.5 leading-none">Church</p>
                </div>

                <div class="text-center mb-8">
                    <p class="font-mono text-[11px] tracking-[0.18em] text-slate-400 uppercase font-bold mb-1">Pre-Service Setup</p>
                    <h3 class="text-xl font-bold text-slate-800">Who's setting up Today?</h3>
                </div>
                
                <div class="overflow-y-auto max-h-[45vh] pr-1 space-y-2.5">
                    <button v-for="name in teamMembers" :key="name" @click="selectUser(name)" class="w-full bg-white border border-slate-200/60 rounded-2xl p-4.5 text-left flex items-center justify-between hover:bg-slate-50 active:scale-[0.99] transition-all shadow-sm group">
                        <div class="flex items-center gap-4">
                            <div class="w-1.5 h-6 bg-slate-300 rounded-full group-hover:bg-brand-green transition-colors"></div>
                            <span class="text-base font-bold text-slate-800">{{ name }}</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-800 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
            </div>
            <div class="p-5 bg-white border-t border-slate-200/80 pb-8 sticky bottom-0">
                <div class="flex gap-2">
                    <input class="flex-1 h-13 px-4 bg-slate-50 border border-slate-200 text-slate-800 text-sm focus:outline-none focus:border-brand-green focus:bg-white rounded-xl placeholder:text-slate-400 transition-colors" placeholder="Add name" v-model="newName" @keyup.enter="addName" />
                    <button @click="addName" class="w-13 h-13 bg-slate-800 text-white flex items-center justify-center font-bold rounded-xl active:scale-95 transition-transform">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div v-if="screen === 'role'" class="p-8 flex flex-col flex-1 min-h-[calc(100vh-56px)] justify-start animate-fade-in">
            <button @click="screen = 'home'" class="mb-8 text-slate-600 hover:text-slate-900 self-start flex items-center gap-1.5 text-sm font-semibold transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back
            </button>
            <p class="font-mono text-[11px] tracking-[0.18em] text-slate-400 uppercase mb-2 font-bold">Welcome, {{ currentName }}</p>
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-8">Choose your role</h1>
            
            <button @click="selectRole('audio')" class="w-full bg-white border border-slate-200/80 p-6 mb-4 rounded-3xl text-left flex justify-between items-center group hover:bg-slate-50 active:scale-[0.99] transition-all shadow-md">
                <div class="flex items-center gap-5">
                    <div class="w-2.5 h-12 bg-brand-green rounded-full"></div> 
                    <div class="text-xl font-bold text-slate-800">Audio</div>
                </div>
            </button>

            <button @click="screen = 'streaming'" class="w-full bg-white border border-slate-200/80 p-6 rounded-3xl text-left flex justify-between items-center group hover:bg-slate-50 active:scale-[0.99] transition-all shadow-md">
                <div class="flex items-center gap-5">
                    <div class="w-2.5 h-12 bg-brand-green rounded-full"></div> 
                    <div class="text-xl font-bold text-slate-800">Visuals</div>
                </div>
            </button>
        </div>

        <div v-if="screen === 'streaming'" class="p-8 flex-1 animate-fade-in">
            <button @click="screen = 'role'" class="mb-8 text-slate-600 self-start flex items-center gap-1.5 text-sm font-semibold">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back
            </button>
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-8">Are we streaming?</h1>
            <div class="flex flex-col gap-4">
                <button @click="selectRole('visuals', 'yes')" class="bg-white border border-slate-200 h-16 rounded-2xl flex items-center justify-between px-6 font-bold uppercase active:scale-98 transition-all shadow-sm">Yes · Streaming</button>
                <button @click="selectRole('visuals', 'no')" class="bg-white border border-slate-200 h-16 rounded-2xl flex items-center justify-between px-6 font-bold uppercase active:scale-98 transition-all shadow-sm">No · In-House</button>
            </div>
        </div>

        <div v-if="screen === 'list'" class="flex flex-col flex-1 animate-fade-in">
            <div class="sticky top-[56px] bg-[#F4F7F2]/95 backdrop-blur-md border-b border-slate-200/80 z-20 px-5 pt-4 pb-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <button @click="screen = 'home'" class="text-slate-600 text-sm font-semibold flex items-center gap-1">Back</button>
                    <div class="text-center text-sm font-bold">{{ currentName }}</div>
                </div>
                <div class="flex-1 h-3 bg-slate-200/80 rounded-full overflow-hidden">
                    <div class="h-full bg-brand-green transition-all duration-300" :style="{ width: progressPercentage + '%' }"></div>
                </div>
            </div>

            <div class="px-4 pb-40 flex-1">
                <div v-for="band in filteredBands" :key="band.label" class="mb-2">
                    <div class="font-mono text-[10px] tracking-[0.25em] text-slate-500 uppercase mt-8 mb-4 font-bold">{{ band.label }}</div>
                    <div v-for="step in band.steps" :key="step.id" class="mb-2.5">
                        <div :class="['flex items-stretch rounded-2xl border shadow-sm', isStepChecked(step.id) ? 'bg-emerald-50/50 border-emerald-200' : 'bg-white border-slate-200']">
                            <div :class="['w-1.5 transition-colors', isStepChecked(step.id) ? 'bg-brand-green' : 'bg-slate-300']"></div>
                            <div class="flex-1 flex items-center p-4.5 cursor-pointer" @click="toggleStep(step.id)">
                                <div :class="['w-6 h-6 rounded-md border-2 flex items-center justify-center transition-all', isStepChecked(step.id) ? 'bg-brand-green border-brand-green text-white' : 'border-slate-300']">
                                    <svg v-if="isStepChecked(step.id)" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                </div>
                                <div class="ml-4 flex-1 font-semibold text-slate-800">{{ step.text }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const INITIAL_TEAM = ["Ver-se", "Tim", "Andy", "Johnny", "Titi", "Izzy", "Neil", "Simon", "Melchizedek", "Ulvis"];
        const STEPS = {
            audio: [{ label: 'Prep', steps: [{ id: 'a1', text: 'Switch on tech' }, { id: 'a2', text: 'Test mics' }] }],
            visuals: [{ label: 'Prep', steps: [{ id: 'v1', text: 'Projectors on' }, { id: 'v2', text: 'OBS Ready' }] }]
        };
        const { createApp } = Vue;
        createApp({
            data() { return { screen: 'home', currentName: null, role: null, streaming: null, teamMembers: [...INITIAL_TEAM], checkedSteps: [], newName: '' } },
            computed: {
                filteredBands() { return this.role ? STEPS[this.role].map(b => ({...b, steps: b.steps.filter(s => !s.branch || s.branch === this.streaming)})) : []; },
                progressPercentage() { return this.filteredBands.length ? Math.round((this.checkedSteps.length / this.filteredBands.flatMap(b=>b.steps).length) * 100) : 0; }
            },
            methods: {
                selectUser(n) { this.currentName = n; this.screen = 'role'; },
                selectRole(r, s=null) { this.role = r; this.streaming = s; this.screen = 'list'; },
                toggleStep(id) { const i = this.checkedSteps.indexOf(id); i > -1 ? this.checkedSteps.splice(i, 1) : this.checkedSteps.push(id); },
                isStepChecked(id) { return this.checkedSteps.includes(id); },
                resetApp() { this.screen = 'home'; this.checkedSteps = []; },
                addName() { if (this.newName && !this.teamMembers.includes(this.newName)) { this.teamMembers.push(this.newName); this.newName = ''; } }
            }
        }).mount('#app');
    </script>
</body>
</html>
